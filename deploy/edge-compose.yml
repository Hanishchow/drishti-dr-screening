# PHC edge node.
#
#   cd deploy && docker compose -f edge-compose.yml up -d
#
# Runs the identical image on CPU against a single SQLite file, with no
# database server and no inbound network dependency. It keeps screening while
# the link to the district is down; `edge_sync.py` pushes the backlog when
# connectivity returns.
services:
  edge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DRISHTI_NODE_ID: ${DRISHTI_NODE_ID:?set a unique node id per PHC}
      DRISHTI_NODE_ROLE: edge
      DRISHTI_DATABASE_URL: sqlite:////app/storage/edge.db
      DRISHTI_SECRET_KEY: ${DRISHTI_SECRET_KEY:?set DRISHTI_SECRET_KEY in .env}
      DRISHTI_BOOTSTRAP_ADMIN_EMAIL: ${DRISHTI_BOOTSTRAP_ADMIN_EMAIL:-}
      DRISHTI_BOOTSTRAP_ADMIN_PASSWORD: ${DRISHTI_BOOTSTRAP_ADMIN_PASSWORD:-}
      # CPU-only: a PHC box has no GPU. ONNX Runtime handles this fine at the
      # one-capture-at-a-time rate a single camera produces.
      DRISHTI_DEVICE: cpu
      DRISHTI_BATCH_SIZE: "1"
      DRISHTI_BATCH_WAIT_MS: "0"
    ports:
      - "${DRISHTI_PORT:-8000}:8000"
    volumes:
      - ../artifacts:/app/artifacts:ro
      - edge-data:/app/storage

volumes:
  edge-data:
